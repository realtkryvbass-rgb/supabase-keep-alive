<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Supabase Keep-Alive</title>
  <meta name="theme-color" content="#0f172a" />
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="icon" type="image/svg+xml" href="icon.svg" />
  <link rel="icon" type="image/png" sizes="192x192" href="icon-192.png" />
  <link rel="apple-touch-icon" href="apple-touch-icon.png" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="Keep-Alive" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <style>
    html { background: #0f172a; color-scheme: dark; }

    :root {
      --bg: #0f172a;
      --card: #1e293b;
      --border: #334155;
      --text: #e2e8f0;
      --muted: #94a3b8;
      --accent: #3b82f6;
      --success: #22c55e;
      --error: #ef4444;
      --warning: #f59e0b;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }

    .container {
      width: 100%;
      max-width: 600px;
    }

    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 28px;
      box-shadow: 0 20px 40px rgba(0,0,0,0.3);
    }

    h1 {
      font-size: 1.4rem;
      font-weight: 600;
      margin-bottom: 6px;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .subtitle {
      color: var(--muted);
      font-size: 0.9rem;
      margin-bottom: 24px;
    }

    button {
      width: 100%;
      background: var(--accent);
      color: white;
      border: none;
      border-radius: 10px;
      padding: 14px 20px;
      font-size: 1rem;
      font-weight: 500;
      cursor: pointer;
      transition: background 0.2s, transform 0.1s;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    button:hover:not(:disabled) {
      background: #2563eb;
    }

    button:active:not(:disabled) {
      transform: scale(0.98);
    }

    button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    .spinner {
      width: 18px;
      height: 18px;
      border: 2px solid rgba(255,255,255,0.3);
      border-top-color: white;
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    #results {
      margin-top: 24px;
      display: none;
    }

    #results.visible {
      display: block;
    }

    .rows {
      display: grid;
      grid-template-columns: minmax(min-content, 0.9fr) 48px minmax(0, 1.3fr);
      column-gap: 8px;
    }

    .table-head,
    .result-item {
      display: grid;
      grid-template-columns: subgrid;
      grid-column: 1 / -1;
      align-items: center;
    }

    .table-head {
      padding: 0 14px 8px;
      font-size: 0.72rem;
      font-weight: 600;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: var(--muted);
    }

    .table-head span:nth-child(2) {
      text-align: center;
    }

    .result-item {
      padding: 12px 14px;
      background: rgba(15, 23, 42, 0.5);
      border-radius: 10px;
      margin-bottom: 8px;
      border: 1px solid var(--border);
    }

    .result-name {
      font-weight: 500;
      font-size: 0.85rem;
      line-height: 1.3;
      overflow-wrap: normal;
      word-break: normal;
      hyphens: none;
    }

    .code {
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      font-size: 0.85rem;
      font-weight: 600;
      text-align: center;
      padding: 4px 0;
      border-radius: 999px;
    }

    .code.ok { background: rgba(34, 197, 94, 0.15); color: var(--success); }
    .code.warn { background: rgba(245, 158, 11, 0.15); color: var(--warning); }
    .code.error { background: rgba(239, 68, 68, 0.15); color: var(--error); }

    .status {
      display: flex;
      align-items: flex-start;
      gap: 8px;
      font-size: 0.88rem;
      line-height: 1.3;
    }

    .status::before {
      content: "";
      flex: none;
      width: 8px;
      height: 8px;
      margin-top: 5px;
      border-radius: 50%;
      background: currentColor;
    }

    .status.ok { color: var(--success); }
    .status.warn { color: var(--warning); }
    .status.error { color: var(--error); }

    .summary {
      margin-top: 16px;
      padding-top: 16px;
      border-top: 1px solid var(--border);
      font-size: 0.9rem;
      color: var(--muted);
      display: flex;
      justify-content: space-between;
    }

    .summary strong {
      color: var(--text);
    }

    .error-msg {
      background: rgba(239, 68, 68, 0.1);
      border: 1px solid rgba(239, 68, 68, 0.3);
      color: #fca5a5;
      padding: 12px 14px;
      border-radius: 10px;
      font-size: 0.9rem;
      margin-top: 16px;
    }
    @media (max-width: 420px) {
      body { padding: 14px; }
      .card { padding: 18px; }
      .table-head { padding: 0 10px 8px; }
      .result-item { padding: 10px; }
      .status { font-size: 0.82rem; }
      .rows { column-gap: 6px; }
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="card">
      <h1>
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M12 2v4M12 18v4M4.93 4.93l2.83 2.83M16.24 16.24l2.83 2.83M2 12h4M18 12h4M4.93 19.07l2.83-2.83M16.24 7.76l2.83-2.83"/>
        </svg>
        Supabase Keep-Alive
      </h1>
      <p class="subtitle">Перевірка активності проєктів</p>

      <button id="runBtn" onclick="runKeepAlive()">
        Запустити перевірку
      </button>

      <div id="results"></div>
    </div>
  </div>

  <script>
    const btn = document.getElementById('runBtn');
    const resultsEl = document.getElementById('results');

    function esc(s) {
      return String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
    }

    // Пояснення кодів відповіді простими словами
    const STATUS_TEXT = {
      200: 'Працює',
      201: 'Працює',
      204: 'Працює',
      301: 'Перенаправлення',
      302: 'Перенаправлення',
      400: 'Відповідає, запит відхилено',
      401: 'Відповідає, ключ не прийнято',
      403: 'Відповідає, доступ закрито',
      404: 'Відповідає, адресу не знайдено',
      405: 'Відповідає, метод не дозволено',
      408: 'Не дочекались відповіді',
      429: 'Забагато запитів',
      500: 'Збій сервера',
      502: 'Сервер недоступний',
      503: 'Сервер недоступний',
      504: 'Не відповів вчасно'
    };

    function describe(r) {
      if (r.error) {
        const timeout = /timeout|timed out/i.test(r.error);
        return {
          cls: 'error',
          code: '—',
          text: timeout ? 'Немає відповіді' : 'Немає з’єднання',
          counted: false
        };
      }
      const s = r.status;
      let cls = 'error';
      let counted = false;
      if (r.ok) { cls = 'ok'; counted = true; }
      else if (s >= 200 && s < 500) { cls = 'warn'; counted = true; } // 4xx теж означає, що база відповіла
      let text = STATUS_TEXT[s];
      if (!text) {
        if (s >= 200 && s < 300) text = 'Працює';
        else if (s >= 300 && s < 400) text = 'Перенаправлення';
        else if (s >= 400 && s < 500) text = 'Відповідає, запит відхилено';
        else if (s >= 500) text = 'Збій сервера';
        else text = 'Невідома відповідь';
      }
      return { cls, code: s ?? '—', text, counted };
    }

    async function runKeepAlive() {
      btn.disabled = true;
      btn.innerHTML = '<div class="spinner"></div> Перевіряю...';
      resultsEl.classList.remove('visible');
      resultsEl.innerHTML = '';

      try {
        const res = await fetch('/.netlify/functions/keep-alive-manual');
        const text = await res.text();
        if (!text.trim()) {
          throw new Error(`Функція повернула порожню відповідь (HTTP ${res.status}). Ймовірно, таймаут або збій функції — перевірте Netlify → Functions → keep-alive-manual → Logs.`);
        }
        let data;
        try {
          data = JSON.parse(text);
        } catch (e) {
          throw new Error(`Відповідь не є JSON (HTTP ${res.status}): ${text.slice(0, 120)}`);
        }
        if (!res.ok && !data.results) {
          throw new Error(`HTTP ${res.status}: ${data.error || data.message || text.slice(0, 120)}`);
        }

        if (!data.results) {
          throw new Error('Невірний формат відповіді');
        }

        let okCount = 0;
        let html = `
          <div class="rows">
          <div class="table-head">
            <span>База</span><span>Код</span><span>Статус</span>
          </div>
        `;

        data.results.forEach(r => {
          const info = describe(r);
          if (info.counted) okCount++;

          html += `
            <div class="result-item">
              <span class="result-name">${esc(r.name)}</span>
              <span class="code ${info.cls}">${info.code}</span>
              <span class="status ${info.cls}">${info.text}</span>
            </div>
          `;
        });

        html += `</div>
          <div class="summary">
            <span>Успішно: <strong>${okCount} / ${data.results.length}</strong></span>
            <span>${new Date().toLocaleTimeString('uk-UA')}</span>
          </div>
        `;

        resultsEl.innerHTML = html;
        resultsEl.classList.add('visible');
      } catch (err) {
        resultsEl.innerHTML = `<div class="error-msg">Помилка: ${err.message}</div>`;
        resultsEl.classList.add('visible');
      } finally {
        btn.disabled = false;
        btn.innerHTML = 'Запустити перевірку';
      }
    }
  </script>
</body>
</html>
